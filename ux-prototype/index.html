<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="FoodFighter High-Fidelity UX/UI Prototype — Explore screen flows, decision-making journeys, and mobile interactions.">
  <title>FoodFighter — High-Fidelity UX Prototype</title>

  <!-- Google Fonts: Poppins & Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Design System Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Core Prototype Engine (Deferred for zero-dependency execution) -->
  <script defer src="app.js"></script>
</head>
<body>

  <!-- Dynamic Application Root Shell -->
  <div id="app-root">
    <!-- Rendered dynamically by app.js hash router -->
  </div>

  <!-- Global Toast Notification Layer -->
  <div id="toast-root" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Developer & Evaluator Prototype Navigator Floating Trigger -->
  <button id="proto-nav-toggle-btn" class="proto-nav-floating-btn" aria-label="Open Prototype Navigator" aria-haspopup="dialog" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
    </svg>
    <span>Prototype</span>
  </button>

  <!-- Prototype Navigator Backdrop -->
  <div id="proto-nav-backdrop" class="proto-nav-backdrop"></div>

  <!-- Prototype Navigator Drawer -->
  <aside id="proto-nav-drawer" class="proto-nav-drawer" role="dialog" aria-modal="true" aria-label="Prototype Navigation Directory">
    <div class="proto-nav-header">
      <div class="proto-nav-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
        <span>Screen Navigator</span>
      </div>
      <button id="proto-nav-close-btn" class="top-bar-action" aria-label="Close Screen Navigator">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Screen Directory Groups -->
    <div id="proto-nav-list" class="proto-nav-content">
      <!-- Populated dynamically from SCREEN_REGISTRY in app.js -->
    </div>

    <div class="proto-nav-footer">
      <button id="proto-reset-btn" class="btn btn-danger btn-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>Reset Prototype State</span>
      </button>
      <div class="font-caption text-muted text-center">FoodFighter UX Prototype V1 • High-Fidelity</div>
    </div>
  </aside>

  <!-- Global Prototype Modal Container -->
  <div id="modal-root"></div>

</body>
</html>
