<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FoodFighter — UX Interactive Prototype</title>
  <meta name="description" content="High-fidelity interactive prototype for FoodFighter group food decision platform.">

  <!-- Google Fonts: Poppins & Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Core & Component Stylesheets (Deterministic load order) -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/screens-foundation.css">
  <link rel="stylesheet" href="styles/screens-room-foodfight.css">
  <link rel="stylesheet" href="styles/screens-recommendation.css">
  <link rel="stylesheet" href="styles/screens-restaurants.css">
  <link rel="stylesheet" href="styles/screens-bill.css">
  <link rel="stylesheet" href="styles/screens-account-history.css">
  <link rel="stylesheet" href="styles/ux-lab.css">
</head>
<body>

  <!-- Dynamic Application Mount Point -->
  <div id="app-root" role="region" aria-label="FoodFighter Application Screen"></div>

  <!-- Toast Notification Overlay Container -->
  <div id="toast-root" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal Dialog Overlay Container -->
  <div id="modal-root"></div>

  <!-- Developer Prototype Navigator Trigger Button -->
  <button 
    id="proto-nav-toggle-btn" 
    class="proto-nav-floating-btn" 
    aria-label="Open Prototype Screen Navigator"
    aria-controls="proto-nav-drawer"
    aria-expanded="false"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <rect x="3" y="3" width="7" height="7"></rect>
      <rect x="14" y="3" width="7" height="7"></rect>
      <rect x="14" y="14" width="7" height="7"></rect>
      <rect x="3" y="14" width="7" height="7"></rect>
    </svg>
    <span>Screens</span>
  </button>

  <!-- Developer Prototype Navigator Drawer -->
  <div id="proto-nav-backdrop" class="proto-nav-backdrop" aria-hidden="true"></div>
  <aside id="proto-nav-drawer" class="proto-nav-drawer" aria-label="Prototype Navigation Drawer">
    <div class="proto-nav-header">
      <div>
        <div class="proto-nav-title">Prototype Navigator</div>
        <div class="font-caption text-secondary" style="font-size:0.75rem;">38 Total Screens • 100% Implemented</div>
      </div>
      <button id="proto-nav-close-btn" class="top-bar-action" aria-label="Close Screen Navigator">✕</button>
    </div>

    <div id="proto-nav-list" class="proto-nav-content"></div>

    <div class="proto-nav-footer">
      <button type="button" id="proto-reset-btn" class="btn btn-secondary btn-sm" style="color:#D32F2F;">
        ↺ Reset Prototype State
      </button>
    </div>
  </aside>

  <!-- Prototype Scripts in Strict Deterministic Dependency Order (Zero-build, 100% file:// compatible) -->
  <script defer src="js/prototype-data.js"></script>
  <script defer src="js/prototype-core.js"></script>
  <script defer src="js/prototype-i18n.js"></script>
  <script defer src="js/screens-foundation.js"></script>
  <script defer src="js/screens-room-foodfight.js"></script>
  <script defer src="js/screens-recommendation.js"></script>
  <script defer src="js/screens-restaurants.js"></script>
  <script defer src="js/screens-bill.js"></script>
  <script defer src="js/screens-account-history.js"></script>
  <script defer src="js/ux-lab-data.js"></script>
  <script defer src="js/ux-lab-components.js"></script>
  <script defer src="js/ux-lab.js"></script>
  <script defer src="app.js"></script>

</body>
</html>
